<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domain Squeeze</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <style>
        :root {
            --background-color: #121212;
            --text-color: #ffffff;
            --primary-color: #bb86fc;
            --secondary-color: #03dac6;
        }
        .light-mode {
            --background-color: #ffffff;
            --text-color: #121212;
            --primary-color: #6200ee;
            --secondary-color: #018786;
        }
        body {
            background-color: var(--background-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }
        button {
            background-color: var(--primary-color);
            color: var(--text-color);
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: var(--secondary-color);
        }
    </style>
</head>
<body class="bg-[var(--background-color)] text-[var(--text-color)]">
    <header class="p-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold">Domain Squeeze</h1>
        <button id="theme-toggle">Toggle Theme</button>
    </header>
    <main>
        <section id="hero" class="text-center py-20">
            <h2 class="text-4xl font-bold mb-4 animate__animated animate__fadeIn">Unlock the True Value of Your Domain</h2>
            <p class="mb-8 animate__animated animate__fadeIn animate__delay-1s">Get AI-powered insights and metrics for your domain name.</p>
            <button id="get-started" class="animate__animated animate__fadeIn animate__delay-2s">Get Started</button>
        </section>
        <section id="domain-form" class="py-10" style="display: none;">
            <form class="max-w-md mx-auto">
                <label for="domain" class="block mb-2">Domain Name</label>
                <input type="text" id="domain" class="w-full p-2 rounded bg-[var(--background-color)] text-[var(--text-color)] border border-[var(--primary-color)]" placeholder="e.g., example.com">
                <button type="submit" class="mt-4 w-full">Get Estimate</button>
            </form>
        </section>
        <section id="results" class="py-10" style="display: none;">
            <h2 class="text-3xl font-bold text-center mb-8">Analysis Report</h2>
            <div class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8">
                <div id="estimated-value" class="p-4 bg-[var(--background-color)] rounded shadow"></div>
                <div id="best-use-case" class="p-4 bg-[var(--background-color)] rounded shadow"></div>
                <div id="who-to-sell-to" class="p-4 bg-[var(--background-color)] rounded shadow"></div>
                <div id="metrics" class="p-4 bg-[var(--background-color)] rounded shadow"></div>
                <div id="comparable-sales" class="p-4 bg-[var(--background-color)] rounded shadow col-span-2"></div>
                <canvas id="metrics-chart" class="mt-8"></canvas>
            </div>
            <button id="download-report" class="mt-8 mx-auto block">Download Report</button>
            <button id="back-to-form" class="mt-4 mx-auto block bg-gray-500">Analyze Another Domain</button>
        </section>
        <div id="loading" class="text-center py-10" style="display: none;">
            <i class="fas fa-spinner fa-spin fa-3x"></i>
            <p>Analyzing domain...</p>
        </div>
    </main>
    <footer class="p-4 text-center bg-[var(--background-color)]">
        <p>© 2023 Domain Squeeze</p>
    </footer>
    <script>
        // Theme toggle
        const themeToggle = document.getElementById('theme-toggle');
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
        });

        // Navigation
        const getStartedButton = document.getElementById('get-started');
        const domainForm = document.getElementById('domain-form');
        const resultsSection = document.getElementById('results');
        const loadingDiv = document.getElementById('loading');

        getStartedButton.addEventListener('click', () => {
            document.getElementById('hero').style.display = 'none';
            domainForm.style.display = 'block';
            domainForm.classList.add('animate__animated', 'animate__fadeIn');
        });

        document.getElementById('back-to-form').addEventListener('click', () => {
            resultsSection.style.display = 'none';
            domainForm.style.display = 'block';
            domainForm.classList.add('animate__animated', 'animate__fadeIn');
        });

        // Form submission
        domainForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const domain = document.getElementById('domain').value;

            if (!validateDomain(domain)) {
                alert('Please enter a valid domain name (e.g., example.com).');
                return;
            }

            domainForm.style.display = 'none';
            loadingDiv.style.display = 'block';

            try {
                const response = await getDomainInfo(domain);
                const data = parseResponse(response);
                displayResults(data);
            } catch (error) {
                alert('An error occurred: ' + error.message);
            } finally {
                loadingDiv.style.display = 'none';
            }
        });

        // Domain validation
        function validateDomain(domain) {
            const regex = /^[a-zA-Z0-9][a-zA-Z0-9-]{1,61}[a-zA-Z0-9]\.[a-zA-Z]{2,}$/;
            return regex.test(domain);
        }

        // Fetch domain info from API route
        async function getDomainInfo(domain) {
            const response = await fetch('/api/getDomainInfo', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ domain })
            });

            if (!response.ok) {
                throw new Error('API request failed');
            }

            const data = await response.json();
            return data.content;
        }

        // Parse API response
        function parseResponse(response) {
            const lines = response.split('\n');
            let data = {
                estimatedValue: '',
                bestUseCase: '',
                whoToSellTo: '',
                metrics: {},
                comparableSales: []
            };
            let currentSection = '';

            lines.forEach(line => {
                if (line.startsWith('Estimated Value:')) {
                    data.estimatedValue = line.replace('Estimated Value:', '').trim();
                } else if (line.startsWith('Best Use Case:')) {
                    data.bestUseCase = line.replace('Best Use Case:', '').trim();
                } else if (line.startsWith('Potential Buyers:')) {
                    data.whoToSellTo = line.replace('Potential Buyers:', '').trim();
                } else if (line.startsWith('Domain Metrics:')) {
                    currentSection = 'metrics';
                } else if (line.startsWith('Recent Sale Analysis:')) {
                    currentSection = 'comparableSales';
                } else if (currentSection === 'metrics' && line.trim()) {
                    const [key, value] = line.split(':').map(part => part.trim());
                    data.metrics[key] = value;
                } else if (currentSection === 'comparableSales' && line.trim()) {
                    const [domain, price] = line.split(':').map(part => part.trim());
                    data.comparableSales.push({ domain, price });
                }
            });

            return data;
        }

        // Display results
        function displayResults(data) {
            document.getElementById('estimated-value').innerHTML = `<h3 class="text-xl font-bold">Estimated Value</h3><p>${data.estimatedValue || 'N/A'}</p>`;
            document.getElementById('best-use-case').innerHTML = `<h3 class="text-xl font-bold">Best Use Case</h3><p>${data.bestUseCase || 'N/A'}</p>`;
            document.getElementById('who-to-sell-to').innerHTML = `<h3 class="text-xl font-bold">Potential Buyers</h3><p>${data.whoToSellTo || 'N/A'}</p>`;

            let metricsHtml = '<h3 class="text-xl font-bold">Metrics</h3>';
            for (const [key, value] of Object.entries(data.metrics)) {
                metricsHtml += `<p title="${getMetricExplanation(key)}">${key}: ${value}</p>`;
            }
            document.getElementById('metrics').innerHTML = metricsHtml;

            let salesHtml = '<h3 class="text-xl font-bold">Recent Sale Analysis</h3><ul>';
            data.comparableSales.forEach(sale => {
                salesHtml += `<li>${sale.domain}: ${sale.price}</li>`;
            });
            salesHtml += '</ul>';
            document.getElementById('comparable-sales').innerHTML = salesHtml;

            // Chart.js example for metrics
            const ctx = document.getElementById('metrics-chart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(data.metrics),
                    datasets: [{
                        label: 'Domain Metrics',
                        data: Object.values(data.metrics).map(val => parseInt(val) || 0),
                        backgroundColor: 'rgba(75, 192, 192, 0.2)',
                        borderColor: 'rgba(75, 192, 192, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });

            resultsSection.style.display = 'block';
            resultsSection.classList.add('animate__animated', 'animate__fadeIn');
        }

        // Metric explanations
        function getMetricExplanation(metric) {
            const explanations = {
                'Search Volume': 'Estimated monthly search volume for the domain\'s keywords.',
                'Competition': 'Level of competition for the domain\'s keywords (Low, Medium, High).'
            };
            return explanations[metric] || '';
        }

        // Download report as PDF
        document.getElementById('download-report').addEventListener('click', () => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text('Domain Squeeze Report', 10, 10);
            doc.text(`Domain: ${document.getElementById('domain').value}`, 10, 20);
            doc.text(document.getElementById('estimated-value').innerText, 10, 30);
            doc.text(document.getElementById('best-use-case').innerText, 10, 40);
            doc.text(document.getElementById('who-to-sell-to').innerText, 10, 50);
            doc.text(document.getElementById('metrics').innerText, 10, 60);
            doc.text(document.getElementById('comparable-sales').innerText, 10, 70);
            doc.save('domain_report.pdf');
        });
    </script>
</body>
</html>
