<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domain Squeeze</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1a202c;
            --text-color: #e2e8f0;
            --primary: #667eea;
            --secondary: #48bb78;
            --card-bg: #2d3748;
        }
        .light-mode {
            --bg-color: #f7fafc;
            --text-color: #2d3748;
            --primary: #4c51bf;
            --secondary: #38a169;
            --card-bg: #ffffff;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            position: sticky;
            top: 0;
            z-index: 10;
            background-color: var(--bg-color);
            border-bottom: 1px solid var(--primary);
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        button {
            background-color: var(--primary);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
        }
        button:hover {
            background-color: var(--secondary);
            transform: scale(1.05);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        th, td {
            border: 1px solid var(--primary);
            padding: 0.75rem;
            text-align: left;
        }
        th {
            background-color: var(--primary);
            color: white;
        }
        a {
            color: var(--primary);
            text-decoration: underline;
        }
        a:hover {
            color: var(--secondary);
        }
        @media (min-width: 768px) {
            .card-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }
        }
    </style>
</head>
<body class="bg-[var(--bg-color)] text-[var(--text-color)]">
    <header class="p-4 flex justify-between items-center animate__animated animate__fadeIn">
        <h1 class="text-xl font-bold"><i class="fas fa-globe mr-2"></i>Domain Squeeze</h1>
        <button id="theme-toggle"><i class="fas fa-moon mr-2"></i>Theme</button>
    </header>
    <main class="container mx-auto px-4 py-6">
        <!-- Landing Page -->
        <section id="hero" class="text-center py-12">
            <h2 class="text-3xl font-bold mb-4 animate__animated animate__fadeIn">Unlock Your Domain’s Full Potential</h2>
            <p class="mb-6 text-lg animate__animated animate__fadeIn animate__delay-1s">AI-driven insights to maximize value and opportunity.</p>
            <button id="get-started" class="animate__animated animate__fadeIn animate__delay-2s"><i class="fas fa-rocket mr-2"></i>Start Now</button>
        </section>
        <!-- Form Section -->
        <section id="domain-form" class="py-6" style="display: none;">
            <form class="max-w-md mx-auto animate__animated animate__fadeIn">
                <label for="domain" class="block mb-2 text-lg"><i class="fas fa-globe mr-2"></i>Domain Name</label>
                <input type="text" id="domain" class="w-full p-2 rounded bg-[var(--card-bg)] text-[var(--text-color)] border border-[var(--primary)]" placeholder="e.g., example.com" required>
                <button type="submit" class="mt-4 w-full"><i class="fas fa-search mr-2"></i>Analyze</button>
            </form>
        </section>
        <!-- Results Section -->
        <section id="results" class="py-6" style="display: none;">
            <h2 class="text-2xl font-bold text-center mb-6 animate__animated animate__fadeIn"><i class="fas fa-file-alt mr-2"></i>Domain Report</h2>
            <div id="report-content" class="space-y-4">
                <div id="domain-image" class="card text-center"><i class="fas fa-spinner fa-spin mr-2"></i>Loading Image...</div>
                <div id="estimated-value" class="card"><i class="fas fa-spinner fa-spin mr-2"></i>Loading...</div>
                <div id="best-use-case" class="card"><i class="fas fa-spinner fa-spin mr-2"></i>Loading...</div>
                <div id="competition" class="card"><i class="fas fa-spinner fa-spin mr-2"></i>Loading...</div>
                <div id="metrics" class="card"><i class="fas fa-spinner fa-spin mr-2"></i>Loading...</div>
                <div id="buyers" class="card"><i class="fas fa-spinner fa-spin mr-2"></i>Loading...</div>
                <div id="partnerships" class="card"><i class="fas fa-spinner fa-spin mr-2"></i>Loading...</div>
                <div id="apis" class="card"><i class="fas fa-spinner fa-spin mr-2"></i>Loading...</div>
            </div>
            <div class="text-center mt-6">
                <button id="download-report" class="mr-4"><i class="fas fa-download mr-2"></i>Download PDF</button>
                <button id="back-to-form" class=""><i class="fas fa-arrow-left mr-2"></i>Back</button>
            </div>
        </section>
    </main>
    <script>
        // Theme toggle
        const themeToggle = document.getElementById('theme-toggle');
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            themeToggle.innerHTML = document.body.classList.contains('light-mode') 
                ? '<i class="fas fa-sun mr-2"></i>Theme' 
                : '<i class="fas fa-moon mr-2"></i>Theme';
        });

        // Navigation
        const getStartedButton = document.getElementById('get-started');
        const domainForm = document.getElementById('domain-form');
        const resultsSection = document.getElementById('results');
        const heroSection = document.getElementById('hero');

        getStartedButton.addEventListener('click', () => {
            heroSection.style.display = 'none';
            domainForm.style.display = 'block';
        });

        document.getElementById('back-to-form').addEventListener('click', () => {
            resultsSection.style.display = 'none';
            domainForm.style.display = 'block';
        });

        // Form submission
        domainForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const domain = document.getElementById('domain').value;

            if (!validateDomain(domain)) {
                alert('Please enter a valid domain name (e.g., example.com).');
                return;
            }

            domainForm.style.display = 'none';
            resultsSection.style.display = 'block';
            fetchAndDisplayReport(domain);
        });

        // Domain validation
        function validateDomain(domain) {
            const regex = /^[a-zA-Z0-9][a-zA-Z0-9-]{1,61}[a-zA-Z0-9]\.[a-zA-Z]{2,}$/;
            return regex.test(domain);
        }

        // Fetch and display report incrementally
        async function fetchAndDisplayReport(domain) {
            // Fetch core data
            const coreResponse = await fetch('/api/getDomainInfo', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ domain })
            });
            const coreData = await coreResponse.json();
            const parsedData = parseResponse(coreData.content);
            displayCoreData(parsedData);

            // Fetch image separately
            const imageResponse = await fetch('/api/getDomainImage', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ domain })
            });
            const imageData = await imageResponse.json();
            displayImage(imageData.imageUrl);
        }

        // Parse core response
        function parseResponse(response) {
            const lines = response.split('\n');
            let data = {
                estimatedValue: '$500-$1,000 (default estimate based on typical domain metrics)', // Fallback
                bestUseCase: '',
                competition: '',
                metrics: {},
                buyers: [],
                partnerships: [],
                apis: []
            };
            let currentSection = '';

            lines.forEach(line => {
                line = line.trim();
                if (!line) return;

                if (line.startsWith('Estimated Value:')) {
                    data.estimatedValue = line.replace('Estimated Value:', '').trim();
                } else if (line.startsWith('Best Use Case:')) {
                    currentSection = 'bestUseCase';
                    data.bestUseCase = line.replace('Best Use Case:', '').trim();
                } else if (line.startsWith('Competition Analysis:')) {
                    currentSection = 'competition';
                    data.competition = line.replace('Competition Analysis:', '').trim();
                } else if (line.startsWith('Domain Metrics:')) {
                    currentSection = 'metrics';
                } else if (line.startsWith('Potential Buyers:')) {
                    currentSection = 'buyers';
                } else if (line.startsWith('Potential Partnerships:')) {
                    currentSection = 'partnerships';
                } else if (line.startsWith('Relevant APIs:')) {
                    currentSection = 'apis';
                } else if (currentSection === 'bestUseCase') {
                    data.bestUseCase += ' ' + line;
                } else if (currentSection === 'competition') {
                    data.competition += ' ' + line;
                } else if (currentSection === 'metrics' && line.includes(':')) {
                    const [key, value] = line.split(':').map(part => part.trim());
                    data.metrics[key] = value;
                } else if (currentSection === 'buyers' && line.includes('|')) {
                    const [company, website, contactPage, reason] = line.split('|').map(part => part.trim());
                    data.buyers.push({ company, website, contactPage, reason });
                } else if (currentSection === 'partnerships' && line.includes('|')) {
                    const [company, website, contactPage, reason] = line.split('|').map(part => part.trim());
                    data.partnerships.push({ company, website, contactPage, reason });
                } else if (currentSection === 'apis' && line.includes(':')) {
                    const [api, description] = line.split(':').map(part => part.trim());
                    data.apis.push({ api, description });
                }
            });

            return data;
        }

        // Display core data
        function displayCoreData(data) {
            document.getElementById('estimated-value').innerHTML = `
                <h3 class="text-lg font-bold"><i class="fas fa-dollar-sign mr-2"></i>Estimated Value</h3>
                <p class="mt-2">${data.estimatedValue}</p>
            `;
            document.getElementById('best-use-case').innerHTML = `
                <h3 class="text-lg font-bold"><i class="fas fa-lightbulb mr-2"></i>Best Use Case</h3>
                <p class="mt-2">${data.bestUseCase || 'N/A'}</p>
            `;
            document.getElementById('competition').innerHTML = `
                <h3 class="text-lg font-bold"><i class="fas fa-chart-line mr-2"></i>Competition Analysis</h3>
                <p class="mt-2">${data.competition || 'N/A'}</p>
            `;
            let metricsHtml = '<h3 class="text-lg font-bold"><i class="fas fa-tachometer-alt mr-2"></i>Domain Metrics</h3><ul class="mt-2">';
            for (const [key, value] of Object.entries(data.metrics)) {
                metricsHtml += `<li>${key}: ${value}</li>`;
            }
            metricsHtml += '</ul>';
            document.getElementById('metrics').innerHTML = metricsHtml;

            let buyersHtml = '<h3 class="text-lg font-bold"><i class="fas fa-users mr-2"></i>Potential Buyers</h3>';
            if (data.buyers.length > 0) {
                buyersHtml += `
                    <table>
                        <thead><tr><th>Company</th><th>Website</th><th>Contact</th><th>Reason</th></tr></thead>
                        <tbody>${data.buyers.map(buyer => `
                            <tr>
                                <td>${buyer.company}</td>
                                <td><a href="${buyer.website}" target="_blank">${buyer.website}</a></td>
                                <td><a href="${buyer.contactPage}" target="_blank">Contact Page</a></td>
                                <td>${buyer.reason}</td>
                            </tr>
                        `).join('')}</tbody>
                    </table>
                `;
            } else {
                buyersHtml += '<p class="mt-2">No buyers identified.</p>';
            }
            document.getElementById('buyers').innerHTML = buyersHtml;

            let partnershipsHtml = '<h3 class="text-lg font-bold"><i class="fas fa-handshake mr-2"></i>Potential Partnerships</h3>';
            if (data.partnerships.length > 0) {
                partnershipsHtml += `
                    <table>
                        <thead><tr><th>Company</th><th>Website</th><th>Contact</th><th>Reason</th></tr></thead>
                        <tbody>${data.partnerships.map(partner => `
                            <tr>
                                <td>${partner.company}</td>
                                <td><a href="${partner.website}" target="_blank">${partner.website}</a></td>
                                <td><a href="${partner.contactPage}" target="_blank">Contact Page</a></td>
                                <td>${partner.reason}</td>
                            </tr>
                        `).join('')}</tbody>
                    </table>
                `;
            } else {
                partnershipsHtml += '<p class="mt-2">No partnerships identified.</p>';
            }
            document.getElementById('partnerships').innerHTML = partnershipsHtml;

            let apisHtml = '<h3 class="text-lg font-bold"><i class="fas fa-plug mr-2"></i>Relevant APIs</h3><ul class="mt-2">';
            data.apis.forEach(api => {
                const apiLink = getApiLink(api.api);
                apisHtml += `<li><a href="${apiLink}" target="_blank">${api.api}</a>: ${api.description}</li>`;
            });
            apisHtml += '</ul>';
            document.getElementById('apis').innerHTML = apisHtml;

            // PDF Download
            document.getElementById('download-report').addEventListener('click', () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                let yOffset = 10;
                const domain = document.getElementById('domain').value;

                const imageElement = document.getElementById('domain-image').querySelector('img');
                if (imageElement) {
                    doc.addImage(imageElement.src, 'PNG', 10, yOffset, 50, 25);
                    yOffset += 35;
                }
                doc.text(`Domain: ${domain}`, 10, yOffset);
                yOffset += 10;

                ['estimated-value', 'best-use-case', 'competition', 'metrics', 'buyers', 'partnerships', 'apis'].forEach(id => {
                    const text = document.getElementById(id).innerText;
                    doc.text(text, 10, yOffset);
                    yOffset += text.split('\n').length * 10 + 10;
                });

                doc.save('domain_squeeze_report.pdf');
            });
        }

        // Display image
        function displayImage(imageUrl) {
            document.getElementById('domain-image').innerHTML = `
                <h3 class="text-lg font-bold"><i class="fas fa-image mr-2"></i>Domain Visual</h3>
                <img src="${imageUrl}" alt="Domain Image" class="mt-2 mx-auto w-full max-w-xs rounded">
            `;
        }

        // API link mapping
        function getApiLink(apiName) {
            const apiLinks = {
                'Google Maps API': 'https://developers.google.com/maps',
                'Twitter API': 'https://developer.twitter.com',
                'OpenWeather API': 'https://openweathermap.org/api'
                // Add more as needed
            };
            return apiLinks[apiName] || `https://www.google.com/search?q=${encodeURIComponent(apiName)}`;
        }
    </script>
</body>
</html>
